<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 24" width="100%" height="24" shape-rendering="crispEdges">
  <defs>
    <style>
      .icon-text { font-family: "Courier New", Courier, monospace; font-size: 11px; font-weight: bold; fill: #2B3A67; }
    </style>
  </defs>
  <!-- Inset retro groove line -->
  <line x1="10" y1="11" x2="380" y2="11" stroke="#B8A38E" stroke-width="2" />
  <line x1="10" y1="13" x2="380" y2="13" stroke="#FFFFFF" stroke-width="1" />

  <!-- Center Decorative Pixel Icons -->
  <g transform="translate(390, 4)">
    <!-- Mini Floppy / Beveled badge -->
    <rect x="0" y="0" width="80" height="16" fill="#F6E8D7" stroke="#786552" stroke-width="1" />
    <line x1="0" y1="0" x2="80" y2="0" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="16" stroke="#FFFFFF" stroke-width="1" />
    <text x="7" y="12" class="icon-text">★ 🐾 :3c ★</text>
  </g>

  <!-- Right groove line -->
  <line x1="480" y1="11" x2="850" y2="11" stroke="#B8A38E" stroke-width="2" />
  <line x1="480" y1="13" x2="850" y2="13" stroke="#FFFFFF" stroke-width="1" />
</svg>